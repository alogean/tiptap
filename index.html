<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mon Paysage Magique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="scene" aria-label="Le paysage"></canvas>

  <nav class="bar" aria-label="Actions">
    <button id="btn-book" type="button" aria-pressed="false"><span class="ico">📖</span><span class="txt">Imagier</span></button>
    <button id="btn-sound" type="button" aria-pressed="false"><span class="ico">🔊</span><span class="txt">Son</span></button>
    <button id="btn-save" type="button"><span class="ico">📷</span><span class="txt">Sauvegarder</span></button>
    <button id="btn-clear" type="button"><span class="ico">🧹</span><span class="txt">Tout effacer</span></button>
  </nav>

  <div id="toast" aria-live="polite"></div>

  <div class="dock">
    <div id="suggest"></div>
    <label id="field">
      <span class="sr">Écris un mot</span>
      <input id="word" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             placeholder="Écris un mot…" maxlength="24" enterkeyhint="done">
    </label>
  </div>

  <dialog id="imagier" aria-labelledby="book-title">
    <header>
      <h2 id="book-title">📖 Mon Imagier</h2>
      <button id="book-close" type="button" aria-label="Fermer">✕</button>
    </header>
    <div id="catalog"></div>
  </dialog>

  <script src="js/words.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
